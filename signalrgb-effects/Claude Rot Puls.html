<html>
<head>
<title>Claude Rot Puls</title>
<meta description="Claude Signal: Claude wartet auf dich - rotes Pulsieren" />
<meta publisher="Claude Signal" />
</head>
<body style="margin:0;background:#300000;">
<script>
const b = document.body;
function pulse(t) {
  const k = 0.5 + 0.5 * Math.sin(t / 127);   // kräftiger Puls ~0,8 s
  const r = Math.round(60 + 195 * k);
  b.style.background = 'rgb(' + r + ',0,0)';
  requestAnimationFrame(pulse);
}
requestAnimationFrame(pulse);
</script>
</body>
</html>
